<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>The Briefing · NBFC Guru</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%237aa2ff%22/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="./data.js"></script>
<style>
/* Dark is the default; body.light is the light theme. */
:root{
  --bg:#0f1420; --card:#171d2b; --card2:#1d2436; --tick:#121827;
  --ink:#e8ecf5; --body:#c4cbdc; --mute:#a3acc2; --faint:#7d87a0;
  --hair:#263049; --brand:#7aa2ff; --brand-ink:#0b1020; --brand-soft:#1c2747;
  --rule:#ff8fa3; --rule-soft:#2a1d27; --good:#2ecc8f; --amber:#f5c451; --amber-soft:#2a2614;
  --up:#2ecc8f; --dn:#ff7b7b; --nav:rgba(15,20,32,.9); --r:14px;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --serif:"Fraunces",Georgia,serif; --read:"Newsreader",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --sans:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
body.light{
  --bg:#eef1f8; --card:#ffffff; --card2:#f3f5fb; --tick:#e4e9f4;
  --ink:#141a2e; --body:#363e58; --mute:#535b76; --faint:#6b7390;
  --hair:#d9dfec; --brand:#1f49e0; --brand-ink:#ffffff; --brand-soft:#e7ecff;
  --rule:#b81f3a; --rule-soft:#fdecef; --good:#127a42; --amber:#8a5300; --amber-soft:#fdf3e0;
  --up:#0f7a43; --dn:#c22525; --nav:rgba(255,255,255,.9);
  --shadow:0 1px 2px rgba(20,26,46,.05),0 12px 30px -22px rgba(31,73,224,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
button{font-family:inherit;cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}
.wrow .wn b .up{color:var(--up)}.wrow .wn b .dn{color:var(--dn)}
/* header */
.hd{position:sticky;top:0;z-index:50;background:var(--nav);border-bottom:1px solid var(--hair);
  backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px)}
.hd-in{max-width:1180px;margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;gap:14px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-ink);flex:none;
  display:flex;align-items:center;justify-content:center;font:700 15px var(--sans)}
.brand{font:600 18px var(--serif);white-space:nowrap}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
.days::-webkit-scrollbar{display:none}
.day{flex:none;border:1px solid var(--hair);background:transparent;color:var(--mute);border-radius:99px;
  padding:5px 12px;font:500 13px var(--sans);white-space:nowrap}
.day[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tabs{margin-left:auto;display:flex;gap:2px}
.tabs button{border:0;background:transparent;color:var(--mute);font:500 14px var(--sans);padding:8px 12px;border-radius:8px}
.tabs button[aria-current="true"]{color:var(--ink);background:var(--card2)}
.theme{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--hair);background:var(--card);
  color:var(--body);display:flex;align-items:center;justify-content:center}
.ic{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* ticker: every figure comes from that day's report (data.js key_numbers) */
.strip{display:flex;align-items:stretch;border-bottom:1px solid var(--hair);background:var(--tick);min-height:42px}
.strip.hide{display:none}
.strip .lead{flex:none;display:flex;align-items:center;gap:6px;padding:0 14px;border-right:1px solid var(--hair);
  font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.tview{flex:1;min-width:0;overflow:hidden;position:relative}
.ttrack{display:flex;width:max-content}
.strip.run .ttrack{animation:tick var(--dur,60s) linear infinite}
.strip.run .tview:hover .ttrack,.strip.run .tview:focus-within .ttrack{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk{flex:none;display:flex;align-items:baseline;gap:8px;padding:11px 18px;border-right:1px solid var(--hair);
  font-size:13px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.tk:hover .tn{text-decoration:underline}
.tk .tn{color:var(--mute)}
.tk b{font:500 13px var(--mono)}
.tk i{font:500 12px var(--mono);font-style:normal}
.tk small{font:500 12px var(--sans);color:var(--faint)}
.tk.miss{color:var(--mute)}
.tk.txt b{text-decoration:underline dotted;text-underline-offset:3px}
@media(prefers-reduced-motion:reduce){
  .strip .tview{overflow-x:auto;scrollbar-width:thin}
  .strip.run .ttrack{animation:none}
  .ttrack .dup{display:none}
  *{transition:none!important;scroll-behavior:auto!important}
}
/* views */
.view{display:none}.view.on{display:block}
.label{font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
/* top row: hero + watchlist */
.toprow{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:22px}
.toprow.solo{grid-template-columns:1fr}
.toprow>*{min-width:0}
.hero .label{color:var(--rule)}
.hero h1{font:600 clamp(26px,3vw,34px)/1.15 var(--serif);margin:10px 0}
.hero h1 a{color:var(--ink);text-decoration:none}.hero h1 a:hover{text-decoration:underline;text-decoration-thickness:1px}
.hero .dek{color:var(--body);font-size:16px;max-width:52em}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.kpi{background:var(--card2);border-radius:10px;padding:12px;text-decoration:none;color:var(--ink);display:block;border:1px solid transparent}
a.kpi:hover{border-color:var(--hair)}
.kpi b{display:block;font:600 22px var(--mono);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.watch h2{font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.wrow{padding:10px 0;border-top:1px solid var(--hair);font-size:14px}
.wrow:first-of-type{border-top:0}
.wrow .wn{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.wrow .wn span{color:var(--body)}
.wrow .wn b{font:500 13.5px var(--mono);text-align:right;white-space:nowrap}
.wrow.wl .wn{display:block}.wrow.wl .wn span{display:block;font-size:12.5px;color:var(--mute)}.wrow.wl .wn b{display:block;text-align:left;white-space:normal;font:600 14.5px var(--sans);color:var(--ink);margin-top:2px}
.meta{display:block;font-size:12px;color:var(--mute);margin-top:3px}
.meta a{color:var(--mute);text-decoration:underline;text-underline-offset:2px}
.meta a:hover{color:var(--brand)}
.wempty{font-size:14px;color:var(--mute);margin-top:10px}
/* section titles */
.sec{margin:30px 2px 12px;display:flex;align-items:baseline;gap:10px}
.sec h2{font:600 22px var(--serif)}
.sec span{font-size:13px;color:var(--mute)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.three>*{min-width:0}
.story{cursor:pointer;display:flex;flex-direction:column;transition:border-color .12s}
.story:hover{border-color:var(--brand)}
.story h3{font:600 18px/1.3 var(--serif);margin:10px 0 6px}
.story p{color:var(--body);font-size:14px}
.go{margin-top:auto;padding-top:12px;font:600 13px var(--sans);color:var(--brand)}
.tag{display:inline-block;font:600 12px var(--sans);padding:3px 8px;border-radius:6px;background:var(--rule-soft);color:var(--rule)}
.tag.r{background:var(--amber-soft);color:var(--amber)}
.tag.w{background:var(--brand-soft);color:var(--brand)}
/* audio */
.abar{margin-top:18px;padding:16px 20px}
.abar-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.play{width:42px;height:42px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:15px;flex:none}
.abar .t b{font-size:15px;display:block}.abar .t span{font-size:13px;color:var(--mute)}
.abar .tm{margin-left:auto;font:500 13px var(--mono);color:var(--mute)}
.spd,.trxbtn{border:1px solid var(--hair);background:var(--card2);border-radius:8px;font:500 13px var(--sans);padding:8px 12px;color:var(--ink)}
.bar{height:5px;background:var(--card2);margin:14px 0 10px;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--brand)}
.transcript{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--hair);font-family:var(--read);
  font-size:16px;line-height:1.7;color:var(--body);max-height:280px;overflow-y:auto;white-space:pre-wrap}
.transcript.on{display:block}
/* desks */
.desk{display:flex;flex-direction:column}
.desk.off{opacity:.62}
.desk-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.desk-top .st{margin-left:auto;font-weight:600;font-size:12.5px}
.st.ok{color:var(--good)}.st.no{color:var(--rule)}
.desk h3{font:600 19px/1.25 var(--serif);margin:10px 0 6px}
.desk .sub{font-size:14px;color:var(--body);margin-bottom:14px}
.cta{margin-top:auto;align-self:flex-start;border:0;border-radius:8px;background:var(--brand);color:var(--brand-ink);font:600 14px var(--sans);padding:9px 16px}
.cta:disabled{background:var(--card2);color:var(--mute);border:1px solid var(--hair);cursor:default}
/* article */
.crumb{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 14px;align-items:center}
.back{border:1px solid var(--hair);background:var(--card);border-radius:99px;font:600 13px var(--sans);padding:8px 14px;color:var(--body)}
.seg{display:flex;background:var(--card2);border:1px solid var(--hair);border-radius:99px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--mute);font:600 13px var(--sans);padding:7px 16px;border-radius:99px;white-space:nowrap}
.seg button[aria-current="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.agrid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;align-items:start}
.sheet{padding:34px 40px}
.sheet .label{color:var(--rule)}
.sheet h1{font:600 clamp(28px,3.4vw,38px)/1.15 var(--serif);margin:8px 0 10px}
.byline{font-size:13.5px;color:var(--mute);margin-bottom:20px}
.otp{border:1px solid var(--hair);background:var(--card2);border-radius:12px;padding:14px 16px;margin-bottom:24px}
.otp .label{margin-bottom:8px;display:block}
.otp nav{display:flex;flex-wrap:wrap;gap:6px}
.otp a{font:500 13px var(--sans);text-decoration:none;color:var(--body);background:var(--card);border:1px solid var(--hair);border-radius:99px;padding:5px 12px}
.otp a:hover{border-color:var(--brand);color:var(--brand)}
.md{font-family:var(--read);font-size:18px;line-height:1.7;color:var(--body);overflow-wrap:break-word}
.md h1,.md h2,.md h3{font-family:var(--serif);color:var(--ink);scroll-margin-top:110px;line-height:1.25}
.md h1{font-size:25px;margin:28px 0 10px}.md h2{font-size:23px;margin:32px 0 12px;padding-top:14px;border-top:1px solid var(--hair)}
.md h3{font-size:19px;margin:22px 0 8px}
.md>h2:first-child{margin-top:0;border-top:0;padding-top:0}
.md p{margin-bottom:14px}
.md ul,.md ol{margin:0 0 14px 1.3em}.md li{margin-bottom:7px}
.md hr{border:0;border-top:1px solid var(--hair);margin:26px 0}
.md strong{color:var(--ink)}
.md a.raw{font-family:var(--sans);font-size:.8em}
.twrap{overflow-x:auto;margin:12px 0 18px;border:1px solid var(--hair);border-radius:12px}
.md table{width:100%;border-collapse:collapse;font:400 14px var(--sans);min-width:520px}
.md th,.md td{padding:10px 12px;border-bottom:1px solid var(--hair);text-align:left;vertical-align:top}
.md th{font-size:12px;letter-spacing:.05em;color:var(--mute);background:var(--card2)}
.rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:112px;max-height:calc(100vh - 124px);overflow-y:auto;scrollbar-width:thin}
.rail .card{padding:16px 18px;scroll-margin-top:112px}
.rail h2{font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.rail h3{font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:14px 0 2px}
.rail .note{font-size:12.5px;color:var(--mute);margin-top:8px}
.rail ol{margin:4px 0 0;padding-left:20px;font-size:13.5px}
.rail li{margin-bottom:6px}
.rail .toc a{color:var(--body);text-decoration:none}.rail .toc a:hover{color:var(--brand);text-decoration:underline}
details.srcs summary{cursor:pointer;font:600 14px var(--sans);color:var(--ink);padding:2px 0}
details.srcs ol{margin-top:10px}
details.srcs a{text-decoration:none;overflow-wrap:anywhere}details.srcs a:hover{text-decoration:underline}
.dom{color:var(--mute);font-size:12px;margin-left:6px}
.sheet-nav{display:flex;gap:10px;margin:16px 0 60px;flex-wrap:wrap}
.btnline{flex:1;border:1px solid var(--hair);background:var(--card);color:var(--ink);border-radius:99px;font:500 14px var(--sans);padding:11px 20px}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{from{box-shadow:0 0 0 3px var(--brand)}to{box-shadow:0 0 0 3px transparent}}
/* archive */
.repohead{margin-top:22px;padding:24px}
.repohead h2{font:600 26px var(--serif)}
.repohead p{font-size:14px;color:var(--mute);margin-top:4px}
.qin{display:flex;align-items:center;gap:8px;border:1px solid var(--hair);border-radius:99px;padding:0 16px;background:var(--card2);margin-top:16px;color:var(--mute)}
.qin input{flex:1;border:0;background:transparent;color:var(--ink);font:400 16px var(--sans);padding:12px 0;outline:none}
.fchips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.fchips button{border:1px solid var(--hair);background:var(--card2);color:var(--body);font:500 13px var(--sans);border-radius:99px;padding:8px 15px}
.fchips button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.archgrid{display:grid;grid-template-columns:250px 1fr;gap:16px;margin-top:16px;align-items:start}
.archgrid>*{min-width:0}
.cal h4{font:600 17px var(--serif);margin-bottom:12px}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .dwk{font:600 12px var(--sans);color:var(--mute);padding:4px 0}
.cal .d{border:1px solid var(--hair);border-radius:8px;padding:5px 0;font:600 13px var(--sans);background:var(--card2);color:var(--faint)}
.cal .d.hit{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);cursor:pointer}
.month{font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:20px 2px 10px}
.month:first-child{margin-top:0}
.daycard{margin-bottom:12px;padding:16px 18px}
.daycard .dh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.daycard b{font:600 18px var(--serif)}
.daycard .kb{font-size:12px;color:var(--mute)}
.rep{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--card2);border:1px solid var(--hair);
  border-radius:10px;padding:11px 14px;margin-top:8px;color:var(--ink);min-width:0}
.rep:hover{border-color:var(--brand)}
.rep .k{font:600 12px var(--sans);color:var(--brand);white-space:nowrap;min-width:52px}
.rep .t{font-size:14px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.empty{border:1px dashed var(--hair);border-radius:14px;padding:34px 20px;text-align:center;font-size:16px;color:var(--mute)}
footer{margin:40px 0 0;padding:20px 0 60px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.snack{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:500 14px var(--sans);
  padding:12px 22px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
.snack.on{opacity:1}
.bnav{display:none}
.only-m{display:none}
@media(max-width:980px){
  .toprow,.three,.agrid{grid-template-columns:1fr}
  .archgrid{grid-template-columns:1fr}
  .rail{position:static;max-height:none;overflow:visible}
  .sheet{padding:26px 24px}
}
@media(min-width:981px){.sheet .otp{display:none}}
@media(max-width:980px){.only-d{display:none}}
@media(max-width:640px){
  html,body{overflow-x:clip}
  .wrap,.hd-in{padding:0 14px}
  .hd-in{height:52px;gap:10px}
  .brand,.tabs{display:none}
  .theme{margin-left:auto}
  .strip .lead{padding:0 10px}
  .strip .lead .lw{display:none}
  .toprow{margin-top:14px;gap:14px}
  .three{gap:14px}
  .hero h1{font-size:25px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi b{font-size:19px}
  .card{padding:18px}
  .sheet{padding:22px 18px}
  .md{font-size:17.5px}
  .sheet-nav{flex-direction:column}
  .bnav{display:flex;position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:12px;right:12px;z-index:60;
    background:var(--nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--hair);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.35);padding:5px}
  .bnav button{flex:1;background:none;border:0;padding:10px 0;color:var(--mute);font:600 14px var(--sans);border-radius:12px}
  .bnav button[aria-current="true"]{background:var(--brand);color:var(--brand-ink)}
  footer{padding-bottom:110px}
  .md h1,.md h2,.md h3{scroll-margin-top:100px}
}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <div class="logo">B</div>
  <div class="brand">The Briefing</div>
  <nav class="days" id="dayPills" aria-label="Edition"></nav>
  <nav class="tabs" aria-label="Sections">
    <button data-view="today" aria-current="true">Today</button>
    <button data-view="article" aria-current="false">Article</button>
    <button data-view="archive" aria-current="false">Archive</button>
  </nav>
  <button class="theme" id="themeBtn" title="Light mode" aria-label="Switch to light mode"></button>
</div></header>
<div class="strip" id="strip" role="region" aria-label="Key numbers from this edition's news report">
  <div class="lead" id="stripLead"></div>
  <div class="tview" id="tview"><div class="ttrack" id="ttrack"></div></div>
</div>

<!-- TODAY -->
<section class="view on" id="view-today"><div class="wrap">
  <div class="toprow" id="toprow">
    <section class="card hero" id="hero"></section>
    <aside class="card watch" id="watch" aria-label="MFL watchlist"></aside>
  </div>
  <div id="storyWrap"><div class="sec"><h2>Also in the news desk</h2></div><div class="three" id="storyRow"></div></div>
  <div class="card abar" id="audioBox" style="display:none">
    <div class="abar-top">
      <button class="play" id="playBtn" aria-label="Play briefing audio">▶</button>
      <div class="t"><b>Morning audio briefing</b><span id="audioSub"></span></div>
      <span class="tm" id="audioTime">--:--</span>
      <button class="spd" id="spdBtn">1x</button>
      <button class="trxbtn" id="trxBtn">Transcript</button>
    </div>
    <div class="bar"><i id="audioBar"></i></div>
    <div class="transcript" id="audioTrx"></div>
  </div>
  <div class="sec"><h2>Desks</h2></div>
  <div class="three" id="deskGrid"></div>

<script>
(function(){
"use strict";
var data=(window.BRIEFING&&window.BRIEFING.days)?window.BRIEFING:{days:[]};
var state={day:(data.days[0]&&data.days[0].id)||null,report:null,archF:'all',view:'today'};
(function(){var h=decodeURIComponent(location.hash.replace('#','')).split('/');
  if(h[0]==='archive')state.view='archive';
  else if(/^\d{4}-\d{2}-\d{2}$/.test(h[0])){state.day=h[0];if(h[1]){state.report=h[1];state.view='article';}}})();
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function domain(u){try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return u;}}
function shortUrl(u){try{var x=new URL(u),p=x.pathname.replace(/\/$/,'');var seg=p.split('/').filter(Boolean).pop()||'';
  seg=seg.replace(/\.(cms|html?|ece|aspx|pdf)$/,'').replace(/[-_]+/g,' ');if(seg.length>40)seg=seg.slice(0,38).replace(/\s+\S*$/,'')+'…';
  return domain(u)+(seg?' · '+seg:'');}catch(e){return u;}}
var URL_RE=/https?:\/\/[^\s<>()\[\]]+/g;
function trimUrl(u){return u.replace(/[.,;:*_]+$/,'');}
/* inline markdown: md links, then bare URLs become short clickable links */
function inlineMd(s){
  var keep=[];
  s=String(s).replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,function(_,t,u){keep.push('<a href="'+esc(u)+'" target="_blank" rel="noreferrer">'+esc(t)+'</a>');return '\u0000'+(keep.length-1)+'\u0000';});
  s=s.replace(URL_RE,function(u){var t=trimUrl(u),rest=u.slice(t.length);
    keep.push('<a class="raw" href="'+esc(t)+'" target="_blank" rel="noreferrer">'+esc(shortUrl(t))+'</a>'+esc(rest));return '\u0000'+(keep.length-1)+'\u0000';});
  s=esc(s).replace(/`([^`]+)`/g,'$1')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^\w*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  return s.replace(/\u0000(\d+)\u0000/g,function(_,i){return keep[+i];});
}
function stripMd(s){return String(s).replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/[*_`#>]/g,'').replace(/\s+/g,' ').trim();}
function noCites(s){return String(s).replace(/\s*\((?:\s*\[[^\]]+\]\([^)]+\)\s*,?)+\)/g,'');}
function clip(s,n){s=String(s).trim();if(s.length<=n)return s;var c=s.slice(0,n),st=Math.max(c.lastIndexOf('. '),c.lastIndexOf('? '),c.lastIndexOf('! '));
  if(st>=n*.55)return c.slice(0,st+1);var sp=c.lastIndexOf(' ');return (sp>0?c.slice(0,sp):c).replace(/[\s,;:—-]+$/,'')+'…';}
function firstSentence(s){var m=String(s).match(/^(.+?[.?!])(\s|$)/);return m?m[1]:s;}
function cleanHead(s){return stripMd(s).replace(/^[^A-Za-z0-9₹]+/,'').trim();}
function slug(s){return cleanHead(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);}
/* source list: every URL with its label, split on " · " */
function sourceList(lines){
  var items=[],seen={};
  lines.join('\n').split(/\n|\s·\s/).forEach(function(piece){
    piece=piece.trim().replace(/^[-*]\s+|^\d+\.\s+/,'');if(!piece)return;
    var md,re=/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,any=false;
    while((md=re.exec(piece))){any=true;add(md[1],md[2]);}
    if(any)return;
    var urls=piece.match(URL_RE)||[];
    urls.forEach(function(u){var lab=piece.split(u)[0].replace(/[:\s—–-]+$/,'').trim();add(lab,trimUrl(u));});
  });
  function add(l,u){if(seen[u])return;seen[u]=1;items.push({l:stripMd(l)||shortUrl(u),u:u});}
  return items;
}
/* markdown -> html. The Key numbers block and the Source Links list are not repeated in the
   body: both live in the side rail (cards #kn-card and #src-card), and "On this page" points there. */
function markdown(src,toc,srcOut){
  var lines=src.split(/\r?\n/),out=[],i=0,pre=true;
  while(i<lines.length){
    var line=lines[i].trim();
    if(!line){i++;continue;}
    var h=line.match(/^(#{1,3})\s+(.+)/);
    if(h){var lvl=h[1].length;
      if(lvl===1&&pre){i++;continue;}
      pre=false;
      if(lvl===2&&/key numbers/i.test(h[2])){i++;
        while(i<lines.length&&!/^##\s/.test(lines[i].trim()))i++;
        if(toc)toc.push({id:'kn-card',t:'Key numbers'});continue;}
      if(lvl===2&&/source/i.test(h[2])){i++;var blk=[];
        while(i<lines.length&&!/^(#{1,2}\s|---+$)/.test(lines[i].trim())){if(lines[i].trim())blk.push(lines[i]);i++;}
        if(srcOut)srcOut.push.apply(srcOut,blk);
        if(toc)toc.push({id:'src-card',t:'Sources'});continue;}
      var id=slug(h[2]);if(toc&&lvl===2)toc.push({id:id,t:cleanHead(h[2])});
      out.push('<h'+lvl+' id="'+id+'">'+inlineMd(h[2])+'</h'+lvl+'>');i++;
      continue;}
    if(pre&&/^\*[^*].*\*$/.test(line)&&/edition/i.test(line)){i++;continue;}
    if(pre&&/^\*\*Date:\*\*/.test(line)){i++;continue;}
    if(/^---+$/.test(line)){if(!pre)out.push('<hr>');i++;continue;}
    if(line.indexOf('|')===0){
      var rows=[];
      while(i<lines.length&&lines[i].trim().indexOf('|')===0){
        var cells=lines[i].trim().replace(/^\||\|$/g,'').split('|').map(function(x){return x.trim();});
        if(!cells.every(function(x){return /^:?-{2,}:?$/.test(x);}))rows.push(cells);i++;}
      if(rows.length)out.push('<div class="twrap"><table><thead><tr>'+rows[0].map(function(x){return '<th>'+inlineMd(x)+'</th>';}).join('')+'</tr></thead><tbody>'+
        rows.slice(1).map(function(r){return '<tr>'+r.map(function(x){return '<td>'+inlineMd(x)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>');
      continue;}
    if(/^[-*]\s+/.test(line)){var items=[];
      while(i<lines.length&&/^[-*]\s+/.test(lines[i].trim())){items.push('<li>'+inlineMd(lines[i].trim().replace(/^[-*]\s+/,''))+'</li>');i++;}
      out.push('<ul>'+items.join('')+'</ul>');continue;}
    if(/^\d+\.\s+/.test(line)){var ol=[];
      while(i<lines.length&&/^\d+\.\s+/.test(lines[i].trim())){ol.push('<li>'+inlineMd(lines[i].trim().replace(/^\d+\.\s+/,''))+'</li>');i++;}
      out.push('<ol>'+ol.join('')+'</ol>');continue;}
    var para=[line];i++;
    while(i<lines.length&&lines[i].trim()&&!/^(#{1,3}\s|---+$|\||[-*]\s+|\d+\.\s+)/.test(lines[i].trim())){para.push(lines[i].trim());i++;}
    out.push('<p>'+inlineMd(para.join(' '))+'</p>');
  }
  return out.join('');
}
/* derived numbers, from the real files */
function words(r){return r.words||stripMd(r.content||'').split(/\s+/).filter(Boolean).length;}
function srcCount(r){if(typeof r.sources==='number')return r.sources;var m=(r.content||'').match(URL_RE)||[],s={};m.forEach(function(u){s[trimUrl(u)]=1;});return Object.keys(s).length;}
function sections(r){return r.sections||((r.content||'').match(/^##\s+.+/gm)||[]).map(cleanHead);}
function mins(n){return Math.max(1,Math.round(n/220));}
function urgentLeads(content){
  var m=content.match(/##\s+🔴[^\n]*\n([\s\S]*?)(?=\n##\s|$)/);
  var scope=m?m[1]:content,leads=[],re=/\*\*(\d+)\.\s*([^*]+?)\*\*\s*([\s\S]*?)(?=\n\*\*\d+\.|\n##\s|$)/g,x;
  while((x=re.exec(scope))&&leads.length<4){
    var title=stripMd(x[2]),head=firstSentence(title),rest=title.slice(head.length).trim();
    var bl=(x[3].match(/^\s*[-*]\s+(.+)$/m)||[])[1]||'';
    leads.push({h:head,rest:rest,b:stripMd(noCites(bl))});}
  return leads;
}
function curDay(){return data.days.filter(function(d){return d.id===state.day;})[0]||data.days[0];}
function filed(day){return day.reports.filter(function(r){return !r.missing;});}
function due(day){return day.reports.filter(function(r){return r.expected;});}
function curReport(day){return day.reports.filter(function(r){return r.id===state.report;})[0]||filed(day)[0]||day.reports[0];}
var snack=$('snack'),st=null;
function toast(m){snack.textContent=m;snack.classList.add('on');clearTimeout(st);st=setTimeout(function(){snack.classList.remove('on');},2200);}
var MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOWS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function dmy(id){var d=new Date(id+'T00:00:00');return d.getDate()+' '+MONS[d.getMonth()];}
/* router */
function setHash(){var h=state.view==='archive'?'#archive':state.view==='article'?'#'+state.day+'/'+state.report:'#'+state.day;
  try{history.replaceState(null,'',h);}catch(e){}}
function goto(v,keepScroll){state.view=v;
  document.querySelectorAll('.view').forEach(function(s){s.classList.remove('on');});
  $('view-'+v).classList.add('on');
  document.querySelectorAll('[data-view]').forEach(function(b){b.setAttribute('aria-current',b.dataset.view===v?'true':'false');});
  $('strip').classList.toggle('hide',v==='archive');
  setHash();if(!keepScroll)window.scrollTo(0,0);if(v!=='archive')sizeTicker();}
document.querySelectorAll('[data-view]').forEach(function(b){b.addEventListener('click',function(){goto(b.dataset.view);});});
document.querySelectorAll('[data-goto]').forEach(function(b){b.addEventListener('click',function(){goto(b.dataset.goto);});});
/* theme: dark by default, light on request, remembered on this device */
var MOON='<svg class="ic" viewBox="0 0 20 20"><path d="M16.5 12.2A6.8 6.8 0 0 1 7.8 3.5a6.8 6.8 0 1 0 8.7 8.7z"/></svg>',
    SUN='<svg class="ic" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/></svg>';
function setLight(on,save){document.body.classList.toggle('light',on);$('themeBtn').innerHTML=on?MOON:SUN;
  $('themeBtn').title=on?'Dark mode':'Light mode';$('themeBtn').setAttribute('aria-label',on?'Switch to dark mode':'Switch to light mode');
  if(save){try{localStorage.setItem('nbfc-dash-theme',on?'light':'dark');}catch(x){}}}
$('themeBtn').addEventListener('click',function(){setLight(!document.body.classList.contains('light'),true);});
var light=false;try{light=localStorage.getItem('nbfc-dash-theme')==='light';}catch(x){}setLight(light,false);

/* ---------- key numbers (only from this day's report; never carried forward) ---------- */
var SHORT={sensex:'Sensex',nifty:'Nifty 50',niftyfin:'Nifty Fin Svcs',manappuram:'Manappuram (peer)',muthoot:'Muthoot Fin (peer)',
  iifl:'IIFL Fin (peer)',shriram:'Shriram Fin (peer)',bajaj:'Bajaj Fin (peer)',usdinr:'USD/INR',gold10g:'Gold ₹/10g',
  brent:'Brent $/bbl',goldspot:'Gold $/oz',fii:'FII net ₹ cr',dii:'DII net ₹ cr'};
var CORE=['sensex','nifty','niftyfin','manappuram','muthoot','iifl','shriram','bajaj','usdinr','gold10g','brent'];
var FULL={sensex:'Sensex',nifty:'Nifty 50',niftyfin:'Nifty Financial Services',manappuram:'Manappuram Finance',muthoot:'Muthoot Finance',
  iifl:'IIFL Finance',shriram:'Shriram Finance',bajaj:'Bajaj Finance',usdinr:'USD/INR',gold10g:'Gold (₹/10g)',brent:'Brent'};
function kn(day){return day.key_numbers||{origin:null,items:[],watchlist:[],core_total:CORE.length,core_found:0};}
function knMissing(day){var have={};kn(day).items.forEach(function(i){have[i.key]=1;});return CORE.filter(function(k){return !have[k];});}
function asofTxt(it,edId){if(!it.asof_label)return 'as-of not stated';
  if(it.asof&&it.asof!==edId)return 'as of '+it.asof_label;return 'as of '+it.asof_label;}
function chgCls(it){return it.dir==='up'?'up':it.dir==='down'?'dn':'';}
function tip(it,day){var t=[(FULL[it.key]||it.name)+': '+it.value+(it.change?' ('+it.change+')':''),asofTxt(it,day.id)];
  if(it.basis)t.push(it.basis);
  t.push(it.source&&it.source.url?'Source: '+it.source.label+' ('+domain(it.source.url)+')':'No source link in the report');
  if(it.origin==='text')t.push('Read from the report text (no Key numbers table that day)');
  return t.join(' · ');}
function srcLink(s){if(!s)return '<span>no source link in report</span>';
  return s.url?'<a href="'+esc(s.url)+'" target="_blank" rel="noreferrer">'+esc(s.label)+'</a>':'<span>'+esc(s.label)+'</span>';}
function newsReport(day){return day.reports.filter(function(r){return r.key.indexOf('01-')===0&&!r.missing;})[0];}
function renderTicker(day){
  var k=kn(day),items=k.items,news=newsReport(day),miss=knMissing(day);
  var lead='<span>Key numbers</span><span class="lw">· '+esc(dmy(day.id))+' report</span>';
  $('stripLead').innerHTML=lead;
  var html=items.map(function(it){
    var href=it.source&&it.source.url?it.source.url:(news?'#'+day.id+'/'+news.id:'#');
    var ext=it.source&&it.source.url;
    var d=it.asof?dmy(it.asof):'date n/s';
    return '<a class="tk'+(it.origin==='text'?' txt':'')+'" href="'+esc(href)+'"'+(ext?' target="_blank" rel="noreferrer"':' data-kn="1"')+' title="'+esc(tip(it,day))+'">'+
      '<span class="tn">'+esc(SHORT[it.key]||it.name)+'</span><b>'+esc(it.value)+'</b>'+(it.change?'<i class="'+chgCls(it)+'">'+esc(it.change)+'</i>':'')+'<small>'+esc(d)+'</small></a>';}).join('');
  if(!items.length)html='<span class="tk miss">Key numbers not in today\'s report</span>';
  else if(miss.length)html+='<span class="tk miss" title="These figures are not in this edition\'s report, so nothing is shown for them.">— not in today\'s report: '+esc(miss.map(function(m){return SHORT[m].replace(' (peer)','');}).join(', '))+'</span>';
  $('ttrack').innerHTML='<div class="tset" style="display:flex">'+html+'</div><div class="tset dup" aria-hidden="true" style="display:flex">'+html.replace(/<a /g,'<a tabindex="-1" ')+'</div>';
  document.querySelectorAll('#ttrack [data-kn]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();if(news){state.day=day.id;open(news.id,'kn-card');}});});
  sizeTicker();
}
function sizeTicker(){var strip=$('strip'),track=$('ttrack'),view=$('tview');if(!track.firstChild)return;
  var one=track.firstChild.scrollWidth,dup=track.querySelector('.dup');
  var run=one>view.clientWidth+4&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  strip.classList.toggle('run',run);if(dup)dup.style.display=run?'flex':'none';
  if(run)track.style.setProperty('--dur',Math.max(25,Math.round(one/45))+'s');}
window.addEventListener('resize',sizeTicker);
function watchRows(list,day){return list.map(function(w){
  return '<div class="wrow wl"><div class="wn"><span>'+esc(w.name)+'</span><b>'+esc(w.value)+'</b></div>'+
    '<span class="meta">'+esc(w.asof_label?'as of '+w.asof_label:'as-of not stated')+' · '+srcLink(w.source)+'</span></div>';}).join('');}

/* header day picker */
function renderPills(){
  var days=data.days.slice(0,3);
  if(days.indexOf(curDay())<0)days=days.slice(0,2).concat([curDay()]);
  $('dayPills').innerHTML=days.map(function(d){var dt=new Date(d.id+'T00:00:00');
    var t=d.reports.filter(function(r){return r.expected;}).map(function(r){return r.section+(r.missing?': not filed':': filed');}).join(' · ');
    return '<button class="day" data-day="'+d.id+'" aria-current="'+(d.id===state.day)+'" title="'+esc(d.label+' — '+t)+'">'+DOWS[dt.getDay()]+' '+dt.getDate()+' '+MONS[dt.getMonth()]+'</button>';}).join('');
  document.querySelectorAll('#dayPills [data-day]').forEach(function(p){p.addEventListener('click',function(){
    state.day=p.dataset.day;state.report=null;renderAll();goto('today');});});
}
function open(rid,anchor){state.report=rid;renderArticle();goto('article');
  if(anchor)setTimeout(function(){var el=$(anchor);if(el){el.scrollIntoView({block:'start'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}},30);}
function nextMonday(id){var d=new Date(id+'T00:00:00');do{d.setDate(d.getDate()+1);}while(d.getDay()!==1);return DOWS[1]+' '+d.getDate()+' '+MONS[d.getMonth()];}
function renderToday(){
  var day=curDay();if(!day)return;state.day=day.id;
  var f=filed(day),d=due(day),totW=f.reduce(function(n,r){return n+words(r);},0),srcs=f.reduce(function(n,r){return n+srcCount(r);},0);
  var news=newsReport(day),leads=news?urgentLeads(news.content):[];
  var top=leads[0],heroRid=news?news.id:(f[0]&&f[0].id),k=kn(day);
  $('hero').innerHTML='<div class="label">'+esc(day.label)+(top?' · Top story · '+esc(news.when)+' IST':'')+'</div>'+
    '<h1><a href="#" data-open="'+esc(heroRid||'')+'">'+esc(top?top.h:(f[0]?f[0].title:'No reports filed'))+'</a></h1>'+
    '<p class="dek">'+esc(top?clip((top.rest?top.rest+' ':'')+top.b,240):(f[0]?f[0].excerpt:''))+'</p>'+
    '<div class="kpis">'+
      '<div class="kpi"><span class="label">Desks filed</span><b>'+f.filter(function(r){return r.expected;}).length+'/'+d.length+'</b><small>due today</small></div>'+
      '<div class="kpi"><span class="label">Read time</span><b>'+mins(totW)+'m</b><small>all desks</small></div>'+
      '<div class="kpi"><span class="label">Sources</span><b>'+srcs+'</b><small>links cited</small></div>'+
      (news?'<a class="kpi" href="#" data-open="'+esc(news.id)+'" data-anchor="kn-card" title="Open the news report\'s key numbers"><span class="label">Key numbers</span><b>'+k.core_found+'/'+k.core_total+'</b><small>'+(k.origin==='block'?'from report table':k.origin==='text'?'read from text':'none in report')+'</small></a>'
        :'<div class="kpi"><span class="label">Key numbers</span><b>—</b><small>no news report</small></div>')+
    '</div>';
  /* MFL watchlist: only what the report's watchlist table gives */
  var wl=k.watchlist||[];
  $('watch').innerHTML=wl.length?'<h2>Watchlist · MFL</h2><div style="margin-top:6px">'+watchRows(wl,day)+'</div>':'';
  $('watch').style.display=wl.length?'':'none';
  $('toprow').classList.toggle('solo',!wl.length);
  var cards=leads.slice(1,4);
  $('storyWrap').style.display=cards.length?'':'none';
  $('storyRow').innerHTML=cards.map(function(L){
    return '<div class="card story" data-open="'+news.id+'" tabindex="0" role="link"><span><span class="tag">News</span></span><h3>'+esc(L.h)+'</h3><p>'+esc(clip((L.rest?L.rest+' ':'')+L.b,170))+'</p><div class="go">Read in the news desk →</div></div>';}).join('');
  $('deskGrid').innerHTML=day.reports.map(function(r){
    var tg=r.key.indexOf('02-')===0?' r':r.key.indexOf('03-')===0?' w':'';
    if(!r.expected&&r.missing){
      return '<div class="card desk off"><div class="desk-top"><span class="tag'+tg+'">'+esc(r.section.toUpperCase())+'</span><span class="st">'+esc(/monday/i.test(r.when)?r.when:'Mondays '+r.when)+' IST</span></div>'+
        '<h3>'+esc(r.title)+'</h3><p class="sub">Files on Mondays. Next edition '+esc(nextMonday(day.id))+'.</p></div>';}
    var status=r.missing?'<span class="st no">Did not file</span>':'<span class="st ok">● Ready · '+mins(words(r))+' min</span>';
    var sub=r.missing?r.excerpt:(sections(r).filter(function(s){return !/key numbers|source/i.test(s);}).length+' sections · '+srcCount(r)+' sources'+(r.id===heroRid&&top?'':' · '+clip(r.excerpt,110)));
    return '<div class="card desk'+(r.missing?' off':'')+'"><div class="desk-top"><span class="tag'+tg+'">'+esc(r.section.toUpperCase())+'</span><span>'+esc(r.agent)+' · '+esc(r.when)+'</span>'+status+'</div>'+
      '<h3>'+esc(r.title)+'</h3><p class="sub">'+esc(sub)+'</p>'+
      (r.missing?'<button class="cta" disabled>Not filed</button>':'<button class="cta" data-open="'+r.id+'">Read '+esc(r.section.toLowerCase())+' →</button>')+'</div>';}).join('');
  document.querySelectorAll('#view-today [data-open]').forEach(function(el){
    el.addEventListener('click',function(e){e.preventDefault();if(el.dataset.open)open(el.dataset.open,el.dataset.anchor);});
    el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();open(el.dataset.open,el.dataset.anchor);}});});
  $('footGen').textContent='Updated '+(data.generated||'—').replace('T',' ')+' IST';
  renderTicker(day);
  loadAudio(day);
}
/* audio: the day's podcast script, read aloud on-device */
var audioText='',audioTimer=null,aSec=0,aDur=0,aRate=1,speaking=false;
function loadAudio(day){var box=$('audioBox');box.style.display='none';stopAudio();if(day.podcast===false)return;
  fetch('./days/'+day.id+'/podcast-script.txt').then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(t){
    if(!t||t.length<200)return;audioText=t;var w=t.split(/\s+/).length;aDur=Math.round(w/(2.4*aRate));
    $('audioTrx').textContent=t;$('audioSub').textContent='~'+Math.round(w/150)+' min · read aloud on this device';box.style.display='block';}).catch(function(){});}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function tickAudio(){$('audioTime').textContent=fmt(aSec)+' / '+fmt(aDur);$('audioBar').style.width=(aDur?Math.min(100,aSec/aDur*100):0)+'%';}
function stopAudio(){clearInterval(audioTimer);audioTimer=null;speaking=false;try{speechSynthesis.cancel();}catch(e){}$('playBtn').textContent='▶';}
$('playBtn').addEventListener('click',function(){
  if(!('speechSynthesis' in window)){toast('Read-aloud is not supported in this browser');return;}
  if(speaking){stopAudio();return;}
  var u=new SpeechSynthesisUtterance(audioText);u.rate=aRate;speechSynthesis.cancel();speechSynthesis.speak(u);speaking=true;$('playBtn').textContent='⏸';
  aSec=0;tickAudio();audioTimer=setInterval(function(){aSec++;tickAudio();},1000);u.onend=function(){stopAudio();aSec=aDur;tickAudio();};});
var rates=[1,1.25,1.5,2],ri=0;
$('spdBtn').addEventListener('click',function(){ri=(ri+1)%rates.length;aRate=rates[ri];$('spdBtn').textContent=rates[ri]+'x';
  aDur=Math.round(audioText.split(/\s+/).length/(2.4*aRate));tickAudio();});
$('trxBtn').addEventListener('click',function(){$('audioTrx').classList.toggle('on');});
/* ARTICLE: body + right rail (key numbers, on this page, sources) */
function allSources(rep,srcLines){
  var list=sourceList(srcLines),seen={};list.forEach(function(x){seen[x.u]=1;});
  var re=/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,m,c=rep.content||'';
  while((m=re.exec(c))){var u=trimUrl(m[2]);if(!seen[u]){seen[u]=1;list.push({l:stripMd(m[1]),u:u});}}
  (c.match(URL_RE)||[]).forEach(function(u){u=trimUrl(u);if(!seen[u]){seen[u]=1;list.push({l:shortUrl(u),u:u});}});
  return list;
}
function knCard(day,rep){
  var k=kn(day),news=newsReport(day),miss=knMissing(day),isNews=news&&news.id===rep.id;
  var h='<section class="card" id="kn-card"><h2>Key numbers</h2>';
  if(!isNews)h+='<p class="note" style="margin:0 0 6px">From this edition\'s news report.</p>';
  if(!k.items.length)h+='<p class="note">Key numbers not in today\'s report.</p>';
  h+=k.items.map(function(it){
    return '<div class="wrow"><div class="wn"><span>'+esc(SHORT[it.key]||it.name)+'</span><b>'+esc(it.value)+(it.change?' <span class="'+chgCls(it)+'">'+esc(it.change)+'</span>':'')+'</b></div>'+
      '<span class="meta">'+esc(asofTxt(it,day.id))+(it.basis?' · '+esc(it.basis):'')+' · '+srcLink(it.source)+'</span></div>';}).join('');
  if(k.items.length&&miss.length)h+='<p class="note">Not in today\'s report: '+esc(miss.map(function(m){return FULL[m];}).join(', '))+'.</p>';
  if(k.origin==='text')h+='<p class="note">This edition has no Key numbers table, so these were read from the report text where the figure and its label were unambiguous. Dotted figures in the ticker are text-read.</p>';
  if((k.watchlist||[]).length)h+='<h3>MFL watchlist</h3>'+watchRows(k.watchlist,day);
  return h+'</section>';
}
function renderArticle(){
  var day=curDay(),rep=curReport(day);if(!rep)return;state.report=rep.id;
  var toc=[],srcLines=[],body=rep.missing?'':markdown(rep.content,toc,srcLines);
  var seg=day.reports.filter(function(r){return r.expected||!r.missing;}).map(function(r){
    return r.missing?'<button disabled title="Did not file">'+esc(r.section)+'</button>':'<button data-seg="'+r.id+'" aria-current="'+(r.id===rep.id)+'">'+esc(r.section)+'</button>';}).join('');
  $('crumbRow').innerHTML='<button class="back" data-back="1">← Today</button><span class="seg">'+seg+'</span>';
  $('crumbRow').querySelector('[data-back]').addEventListener('click',function(){goto('today');});
  document.querySelectorAll('#crumbRow [data-seg]').forEach(function(b){b.addEventListener('click',function(){open(b.dataset.seg);});});
  var srcs=rep.missing?[]:allSources(rep,srcLines);
  if(!toc.some(function(t){return t.id==='kn-card';}))toc.unshift({id:'kn-card',t:'Key numbers'});
  if(srcs.length&&!toc.some(function(t){return t.id==='src-card';}))toc.push({id:'src-card',t:'Sources'});
  var by=[day.label,rep.agent,rep.when+' IST'];if(!rep.missing){by.push(mins(words(rep))+' min read');if(srcs.length)by.push(srcs.length+' sources');}
  var chips=toc.map(function(x){return '<a href="#" data-to="'+x.id+'">'+esc(x.t)+'</a>';}).join('');
  $('sheet').innerHTML='<div class="label">'+esc(rep.section)+' · '+esc(rep.kind)+'</div><h1>'+esc(rep.title)+'</h1>'+
    '<p class="byline">'+esc(by.join(' · '))+'</p>'+(rep.missing?'<p class="md">'+esc(rep.excerpt)+'</p>':
    (toc.length>1?'<div class="otp"><span class="label">On this page</span><nav>'+chips+'</nav></div>':'')+'<div class="md">'+body+'</div>');
  var rail=knCard(day,rep);
  if(toc.length>1)rail+='<section class="card toc only-d"><h2>On this page</h2><ol>'+toc.map(function(x){return '<li><a href="#" data-to="'+x.id+'">'+esc(x.t)+'</a></li>';}).join('')+'</ol></section>';
  if(srcs.length)rail+='<section class="card" id="src-card"><h2>Sources</h2><details class="srcs"><summary>Show all '+srcs.length+' source links</summary><ol>'+srcs.map(function(x){
    return '<li><a href="'+esc(x.u)+'" target="_blank" rel="noreferrer">'+esc(x.l)+'</a><span class="dom">'+esc(domain(x.u))+'</span></li>';}).join('')+'</ol></details></section>';
  $('rail').innerHTML=rail;
  document.querySelectorAll('#sheet [data-to],#rail [data-to]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();
    var el=document.getElementById(a.dataset.to);if(!el)return;
    if(a.dataset.to==='src-card'){var dt=el.querySelector('details');if(dt)dt.open=true;}
    el.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
    if(el.classList.contains('card')){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}});});
  var sibs=filed(day),ix=sibs.indexOf(rep),nx=sibs[(ix+1)%sibs.length],nb=$('nextDeskBtn');
  if(nx&&nx.id!==rep.id){nb.style.display='';nb.textContent='Next: '+nx.title+' →';nb.onclick=function(){open(nx.id);};}else nb.style.display='none';
  renderTicker(day);
}
$('copyLinkBtn').addEventListener('click',function(){var link=location.href;
  if(navigator.clipboard)navigator.clipboard.writeText(link).then(function(){toast('Link copied');},function(){toast(link);});else toast(link);});
/* ARCHIVE */
function monthOf(id){return new Date(id+'T00:00:00').toLocaleString('en-IN',{month:'long',year:'numeric'});}
function renderArchive(){
  var term=($('q').value||'').toLowerCase(),f=state.archF,html='',lastMonth='',hits=0;
  var ref=new Date(data.days[0].id+'T00:00:00'),Y=ref.getFullYear(),M=ref.getMonth();
  $('calMon').textContent=ref.toLocaleString('en-IN',{month:'long',year:'numeric'});
  var have={};data.days.forEach(function(d){have[d.id]=d;});
  var first=(new Date(Y,M,1).getDay()+6)%7,dim=new Date(Y,M+1,0).getDate(),cal='';
  ['M','T','W','T','F','S','S'].forEach(function(w){cal+='<span class="dwk">'+w+'</span>';});
  for(var b=0;b<first;b++)cal+='<span></span>';
  for(var dd=1;dd<=dim;dd++){var id=Y+'-'+String(M+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
    cal+=have[id]?'<span class="d hit" data-cal="'+id+'" title="Open this edition">'+dd+'</span>':'<span class="d">'+dd+'</span>';}
  $('calDays').innerHTML=cal;
  document.querySelectorAll('#calDays [data-cal]').forEach(function(c){c.addEventListener('click',function(){state.day=c.dataset.cal;state.report=null;renderAll();goto('today');});});
  data.days.forEach(function(day){
    var rows=day.reports.filter(function(r){if(r.missing)return false;if(f!=='all'&&r.kind!==f)return false;
      return !term||((r.title+' '+r.excerpt+' '+(r.content||'')).toLowerCase().indexOf(term)>=0);});
    if(!rows.length)return;hits++;
    var m=monthOf(day.id);if(m!==lastMonth){html+='<div class="month">'+esc(m)+'</div>';lastMonth=m;}
    var k=kn(day),kb=k.origin==='block'?'Key numbers: '+k.core_found+'/'+k.core_total+' (table)':k.origin==='text'?'Key numbers: '+k.core_found+'/'+k.core_total+' (read from text)':'No key numbers';
    html+='<div class="card daycard"><div class="dh"><b>'+esc(day.label)+'</b><span class="kb">'+esc(kb)+'</span></div>';
    rows.forEach(function(r){html+='<button class="rep" data-d="'+day.id+'" data-r="'+r.id+'"><span class="k">'+esc(r.section)+'</span><span class="t">'+esc(clip(r.excerpt||r.title,140))+'</span></button>';});
    html+='</div>';});
  $('archSub').textContent=data.days.length+' editions'+(term||f!=='all'?' · '+hits+' match':'');
  $('archList').innerHTML=html||'<div class="empty">Nothing matches. Try a different search.</div>';
  document.querySelectorAll('#archList .rep').forEach(function(b){b.addEventListener('click',function(){state.day=b.dataset.d;state.report=b.dataset.r;renderAll();goto('article');});});
}
$('q').addEventListener('input',renderArchive);
document.querySelectorAll('#chips button').forEach(function(b){b.addEventListener('click',function(){
  document.querySelectorAll('#chips button').forEach(function(x){x.classList.remove('on');});b.classList.add('on');state.archF=b.dataset.f||'all';renderArchive();});});
function renderAll(){renderPills();renderToday();renderArticle();renderArchive();}
if(!data.days.length){document.body.innerHTML='<div class="wrap" style="padding:60px 20px;font-size:18px">Could not load data.js.</div>';}
else{renderAll();var r0=state.view==='article'?curReport(curDay()):null;
  goto(state.view==='article'&&!(r0&&!r0.missing)?'today':state.view,true);}
})();
</script>
